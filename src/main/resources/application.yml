spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/momentum}
    username: ${DATABASE_USERNAME:momentum}
    password: ${DATABASE_PASSWORD:momentum}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
momentum:
  level-thresholds: [0, 100, 250, 450, 700, 1000, 1400, 1900]
